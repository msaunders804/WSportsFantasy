{% extends "base.html" %}
{% block title %}Log in | Undertow Fantasy{% endblock %}
{% block content %}
<section class="block">
  <div class="wrap page">
    <h1>Log in</h1>
    <form class="card" method="post" action="/login">
      {% if errors.form %}<p class="alert" role="alert">{{ errors.form }}</p>{% endif %}
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required value="{{ form.email or '' }}">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">Log in</button>
      <p class="fine"><a href="/password/forgot">Forgot your password, or haven't set one yet?</a></p>
      <p class="fine">New here? <a href="/register{% if next %}?next={{ next | urlencode }}{% endif %}">Create an account</a>.</p>
    </form>
  </div>
</section>
{% endblock %}
