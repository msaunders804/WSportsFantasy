<section class="card share" data-share>
  <h2>Know someone who'd love this?</h2>
  <p>Send them this link. They can join the list, and more friends makes for better leagues.</p>
  <div class="share-row">
    <input type="text" readonly value="{{ share_url }}" aria-label="Link to share">
    <button class="btn-copy" type="button" data-copy>Copy link</button>
    <button class="btn-copy" type="button" data-native-share hidden>Share…</button>
  </div>
  <p class="fine" data-copy-status role="status" aria-live="polite"></p>
</section>
