{% if accounts_enabled %}
{% if nav_user %}
<a class="acct" href="/account" aria-label="My account ({{ nav_user.display_name }})">
  <span class="acct-avatar" aria-hidden="true">{{ (nav_user.display_name or nav_user.email)[:1] | upper }}</span>
  <span class="acct-name">{{ nav_user.display_name }}</span>
</a>
{% else %}
<a class="login-link" href="/login">Log in</a>
{% endif %}
{% endif %}
