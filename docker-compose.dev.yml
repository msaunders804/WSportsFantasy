# Local development only. Production runs on Railway (see docs/decisions.md).
# Host port 5433 because 5432 is taken by another service on the dev box.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: undertow
      POSTGRES_PASSWORD: undertow
      POSTGRES_DB: undertow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undertow"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
